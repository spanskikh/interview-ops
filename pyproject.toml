[project]
name = "interview-ops"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=2.0.0",
    "pydantic>=2.9.0",
    "duckdb>=1.1.0",
    "z3-solver>=4.13.0",
    "httpx>=0.28.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
